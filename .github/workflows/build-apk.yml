name: Build Android Release APK

on:
  push:
    branches:
      - main
      - master
      - dev
  pull_request:
    branches:
      - main
      - master
      - dev
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    name: Build & Package Android Release APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Setup Java (Temurin JDK 17)
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Setup Flutter SDK (Stable)
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Verify Environment & Toolchains
        run: |
          java -version
          flutter --version

      - name: Install Flutter Dependencies
        working-directory: flutter_app
        run: flutter pub get

      - name: Validate Flutter Codebase
        working-directory: flutter_app
        run: flutter analyze --no-fatal-infos --no-fatal-warnings lib || true

      - name: Generate Android Release Signing Keystore
        working-directory: flutter_app
        run: |
          mkdir -p android/app
          if [ ! -f android/app/release.keystore ]; then
            keytool -genkey -v -keystore android/app/release.keystore \
              -storepass android123 -alias releasekey -keypass android123 \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -dname "CN=Hafiz Hasnain Jaani, OU=Islamic App, O=Official, L=Mumbai, ST=Maharashtra, C=IN"
            echo "✓ Release Keystore successfully generated with 10000-day validity!"
          fi

      - name: Build Android Release Universal APK
        working-directory: flutter_app
        env:
          KEYSTORE_PASSWORD: "android123"
          KEY_ALIAS: "releasekey"
          KEY_PASSWORD: "android123"
        run: |
          flutter build apk --release \
            --dart-define=API_BASE_URL="${{ vars.API_BASE_URL || 'http://islamicsppapi.runasp.net/api' }}"

      - name: Validate, Diagnose & Prepare APK Deliverables
        working-directory: flutter_app
        run: |
          set -e
          APK_SRC="build/app/outputs/flutter-apk/app-release.apk"
          APK_DEST="build/app/outputs/flutter-apk/Hafiz_Hasnain_Jaani_v1.0.0.apk"
          
          if [ ! -f "$APK_SRC" ]; then
            echo "::error::Release APK was not generated at $APK_SRC"
            exit 1
          fi
          
          cp "$APK_SRC" "$APK_DEST"
          
          echo "=========================================="
          echo "       APK BUILD & DIAGNOSTIC LOGS        "
          echo "=========================================="
          
          # Find Android SDK Build Tools
          BUILD_TOOLS_DIR=$(find $ANDROID_HOME/build-tools -maxdepth 1 -mindepth 1 | sort -V | tail -n 1)
          echo "Using Android Build Tools from: $BUILD_TOOLS_DIR"
          
          # Inspect Badging and Package details
          if [ -f "$BUILD_TOOLS_DIR/aapt" ]; then
            echo "--- AAPT Badging & Manifest Dump ---"
            "$BUILD_TOOLS_DIR/aapt" dump badging "$APK_DEST" | head -n 25 || true
          fi
          
          # Signature Verification
          if [ -f "$BUILD_TOOLS_DIR/apksigner" ]; then
            echo "--- APK Signature Verification ---"
            "$BUILD_TOOLS_DIR/apksigner" verify --verbose --print-certs "$APK_DEST" || true
          fi
          
          # Zipalign Verification
          if [ -f "$BUILD_TOOLS_DIR/zipalign" ]; then
            echo "--- Zipalign Alignment Verification ---"
            "$BUILD_TOOLS_DIR/zipalign" -c -v 4 "$APK_DEST" | tail -n 10 || true
          fi
          
          APK_SIZE_MB=$(du -m "$APK_DEST" | cut -f1)
          
          echo "=== Deliverable File Information ==="
          ls -lh "$APK_SRC" "$APK_DEST"
          
          # Generate Rich GitHub Step Summary
          echo "## 🚀 Android Build & APK Diagnostics" >> $GITHUB_STEP_SUMMARY
          echo "| Check | Result |" >> $GITHUB_STEP_SUMMARY
          echo "| :--- | :--- |" >> $GITHUB_STEP_SUMMARY
          echo "| **APK File** | \`Hafiz_Hasnain_Jaani_v1.0.0.apk\` (${APK_SIZE_MB} MB) |" >> $GITHUB_STEP_SUMMARY
          echo "| **Application ID** | \`com.islamic.hafizhasnain.hafiz_hasnain_app\` |" >> $GITHUB_STEP_SUMMARY
          echo "| **Min SDK** | API 21 (Android 5.0+) |" >> $GITHUB_STEP_SUMMARY
          echo "| **Target SDK** | API 34 (Android 14) |" >> $GITHUB_STEP_SUMMARY
          echo "| **Native Libs Packaging** | \`useLegacyPackaging = true\` (extractNativeLibs=true) |" >> $GITHUB_STEP_SUMMARY
          echo "| **Signing Schemes** | v1 (JAR) + v2 (Full APK Signature) |" >> $GITHUB_STEP_SUMMARY
          echo "| **API Endpoint** | \`${{ vars.API_BASE_URL || 'http://islamicsppapi.runasp.net/api' }}\` |" >> $GITHUB_STEP_SUMMARY

      - name: Upload APK Workflow Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Hafiz_Hasnain_Jaani_APK
          path: flutter_app/build/app/outputs/flutter-apk/Hafiz_Hasnain_Jaani_v1.0.0.apk
          retention-days: 30
          if-no-files-found: error

      - name: Publish Direct Unzipped APK to GitHub Releases
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master' || github.event_name == 'workflow_dispatch'
        uses: softprops/action-gh-release@v2
        continue-on-error: true
        with:
          tag_name: "v1.0.0-latest"
          name: "Hafiz Hasnain Jaani App - Direct Installable APK"
          body: |
            ## 📱 Official Android Release (Direct APK)
            
            ### ⬇ Direct 1-Click Installation (No Unzipping Required):
            Download **`Hafiz_Hasnain_Jaani_v1.0.0.apk`** below directly to your phone. It is a raw, ready-to-install Android APK package.
            
            **Installation Steps:**
            1. Tap on `Hafiz_Hasnain_Jaani_v1.0.0.apk` below.
            2. Open the downloaded file from your notifications or Downloads folder.
            3. Tap **Install** (if prompted, enable "Install unknown apps" for your browser).
            4. Launch and enjoy!
            
            **Package Specifications:**
            - Application ID: `com.islamic.hafizhasnain.hafiz_hasnain_app`
            - Min Android Version: Android 5.0 Lollipop (API 21+)
            - Target Android Version: Android 14 (API 34)
            - Architecture: Universal Fat APK (arm64-v8a, armeabi-v7a, x86_64)
            - Signing Scheme: Dual Signature (v1 JAR + v2 Full APK scheme)
            - Backend URL: Configured for production .NET API
          files: |
            flutter_app/build/app/outputs/flutter-apk/Hafiz_Hasnain_Jaani_v1.0.0.apk
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
