name: Build Android Release APK

on:
  push:
    branches:
      - main
      - master
      - dev
  pull_request:
    branches:
      - main
      - master
      - dev
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    name: Build & Package Android Release APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Setup Java (Temurin JDK 17)
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Setup Flutter SDK (Stable)
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Verify Environment & Toolchains
        run: |
          java -version
          flutter --version

      - name: Install Flutter Dependencies
        working-directory: flutter_app
        run: flutter pub get

      - name: Validate Flutter Codebase
        working-directory: flutter_app
        run: flutter analyze --no-fatal-infos --no-fatal-warnings lib || true

      - name: Generate Android Release Signing Keystore
        working-directory: flutter_app
        run: |
          mkdir -p android/app
          if [ ! -f android/app/release.keystore ]; then
            keytool -genkey -v -keystore android/app/release.keystore \
              -storepass android123 -alias releasekey -keypass android123 \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -dname "CN=Hafiz Hasnain Jaani, OU=Islamic App, O=Official, L=Mumbai, ST=Maharashtra, C=IN"
            echo "✓ Release Keystore successfully generated with 10000-day validity!"
          fi

      - name: Build Android Release APKs (Universal & 64-bit ARM)
        working-directory: flutter_app
        env:
          KEYSTORE_PASSWORD: "android123"
          KEY_ALIAS: "releasekey"
          KEY_PASSWORD: "android123"
        run: |
          set -o pipefail
          echo "=== Step A: Building Universal Release APK ==="
          flutter build apk --release \
            --dart-define=API_BASE_URL="${{ vars.API_BASE_URL || 'http://islamicsppapi.runasp.net/api' }}" 2>&1 | tee ../flutter_build.log || {
              echo "::error::Flutter Universal Build Failed! Last 150 lines of log:"
              tail -n 150 ../flutter_build.log
              exit 1
            }

          echo "=== Step B: Building Split-per-ABI APKs (arm64-v8a for Android 15) ==="
          flutter build apk --release --split-per-abi \
            --dart-define=API_BASE_URL="${{ vars.API_BASE_URL || 'http://islamicsppapi.runasp.net/api' }}" 2>&1 | tee -a ../flutter_build.log || true

      - name: Upload Build Log on Failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: flutter-build-failure-log
          path: flutter_build.log

      - name: Validate, Diagnose & Prepare APK Deliverables
        working-directory: flutter_app
        run: |
          set -e
          OUT_DIR="build/app/outputs/flutter-apk"
          
          # Target deliverables
          UNIVERSAL_SRC="$OUT_DIR/app-release.apk"
          ARM64_SRC="$OUT_DIR/app-arm64-v8a-release.apk"
          
          UNIVERSAL_DEST="$OUT_DIR/Hafiz_Hasnain_Jaani_Universal.apk"
          ARM64_DEST="$OUT_DIR/Hafiz_Hasnain_Jaani_arm64.apk"
          MAIN_DEST="$OUT_DIR/Hafiz_Hasnain_Jaani_v1.0.0.apk"
          
          if [ -f "$UNIVERSAL_SRC" ]; then
            cp "$UNIVERSAL_SRC" "$UNIVERSAL_DEST"
          fi
          
          if [ -f "$ARM64_SRC" ]; then
            cp "$ARM64_SRC" "$ARM64_DEST"
            # Point primary APK to arm64-v8a for modern Android 10-15 compatibility
            cp "$ARM64_SRC" "$MAIN_DEST"
          elif [ -f "$UNIVERSAL_SRC" ]; then
            cp "$UNIVERSAL_SRC" "$MAIN_DEST"
          fi
          
          echo "=========================================="
          echo "       APK BUILD & DIAGNOSTIC LOGS        "
          echo "=========================================="
          
          BUILD_TOOLS_DIR=$(find $ANDROID_HOME/build-tools -maxdepth 1 -mindepth 1 | sort -V | tail -n 1)
          echo "Using Android Build Tools: $BUILD_TOOLS_DIR"
          
          if [ -f "$BUILD_TOOLS_DIR/aapt" ]; then
            echo "--- AAPT Badging & Manifest Dump ($MAIN_DEST) ---"
            "$BUILD_TOOLS_DIR/aapt" dump badging "$MAIN_DEST" | head -n 30 || true
          fi
          
          if [ -f "$BUILD_TOOLS_DIR/apksigner" ]; then
            echo "--- APK Signature Verification ($MAIN_DEST) ---"
            "$BUILD_TOOLS_DIR/apksigner" verify --verbose --print-certs "$MAIN_DEST" || true
          fi
          
          if [ -f "$BUILD_TOOLS_DIR/zipalign" ]; then
            echo "--- Zipalign Alignment Verification ($MAIN_DEST) ---"
            "$BUILD_TOOLS_DIR/zipalign" -c -v 4 "$MAIN_DEST" | tail -n 10 || true
          fi
          
          echo "=== Deliverables Available ==="
          ls -lh "$OUT_DIR"/*.apk
          
          MAIN_SIZE_MB=$(du -m "$MAIN_DEST" | cut -f1)
          
          echo "## 🚀 Android Build & APK Diagnostics" >> $GITHUB_STEP_SUMMARY
          echo "| Check | Result |" >> $GITHUB_STEP_SUMMARY
          echo "| :--- | :--- |" >> $GITHUB_STEP_SUMMARY
          echo "| **Primary APK** | \`Hafiz_Hasnain_Jaani_v1.0.0.apk\` (${MAIN_SIZE_MB} MB) |" >> $GITHUB_STEP_SUMMARY
          echo "| **Application ID** | \`com.islamic.hafizhasnain.hafiz_hasnain_app\` |" >> $GITHUB_STEP_SUMMARY
          echo "| **Compile SDK** | API 35 (Android 15 Stable) |" >> $GITHUB_STEP_SUMMARY
          echo "| **Min SDK** | API 24 (Android 7.0+) |" >> $GITHUB_STEP_SUMMARY
          echo "| **Target SDK** | API 34 (Android 14) |" >> $GITHUB_STEP_SUMMARY
          echo "| **Signing Schemes** | v1 (JAR) + v2 (Full APK) + v3 |" >> $GITHUB_STEP_SUMMARY
          echo "| **Architecture** | 64-bit ARM (arm64-v8a) & Universal |" >> $GITHUB_STEP_SUMMARY

      - name: Upload APK Workflow Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Hafiz_Hasnain_Jaani_APKs
          path: |
            flutter_app/build/app/outputs/flutter-apk/Hafiz_Hasnain_Jaani_v1.0.0.apk
            flutter_app/build/app/outputs/flutter-apk/Hafiz_Hasnain_Jaani_arm64.apk
            flutter_app/build/app/outputs/flutter-apk/Hafiz_Hasnain_Jaani_Universal.apk
          retention-days: 30
          if-no-files-found: error

      - name: Publish Direct Unzipped APKs to GitHub Releases
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master' || github.event_name == 'workflow_dispatch'
        uses: softprops/action-gh-release@v2
        continue-on-error: true
        with:
          tag_name: "v1.0.0-latest"
          name: "Hafiz Hasnain Jaani App - Direct Installable APK"
          body: |
            ## 📱 Official Android Release (Direct APK)
            
            ### ⬇ Download Links:
            1. **[Recommended for Android 10-15 Phones]**: Download **`Hafiz_Hasnain_Jaani_arm64.apk`** (~21 MB) — Optimized 64-bit build with fastest download and zero parsing issues.
            2. **[Universal Build]**: Download **`Hafiz_Hasnain_Jaani_Universal.apk`** (~62 MB) — Contains all architectures.
            3. **`Hafiz_Hasnain_Jaani_v1.0.0.apk`** — Default 64-bit release build.
            
            **Installation Steps:**
            1. Tap on the `.apk` file below.
            2. Wait for the download to complete 100%.
            3. Tap **Install** (allow installation from unknown sources if prompted).
            4. Launch and enjoy!
          files: |
            flutter_app/build/app/outputs/flutter-apk/Hafiz_Hasnain_Jaani_v1.0.0.apk
            flutter_app/build/app/outputs/flutter-apk/Hafiz_Hasnain_Jaani_arm64.apk
            flutter_app/build/app/outputs/flutter-apk/Hafiz_Hasnain_Jaani_Universal.apk
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
